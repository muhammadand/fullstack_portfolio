name: CI/CD Deploy to Rumahweb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Laravel Project
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Sesuaikan versi Node.js jika perlu
        
    - name: Install NPM & Build
      run: |
        npm install
        npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Sesuaikan dengan versi PHP di hosting
    
    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader
    
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        server-dir: /public_html/company-profile/
        exclude: |
          **/.vscode/**
          **/.git/**
          # **/vendor/**  <-- Commented: Vendor sekarang ikut diupload karena sudah di-build di runner
          **/node_modules/**
          .env
          storage/framework/cache/**
          storage/framework/sessions/**
          storage/framework/views/**
          storage/logs/**
          public/sitemap.xml

    # Opsional: Jika hosting Anda memiliki akses SSH (Rumahweb biasanya ada), 
    # Anda bisa menjalankan migrate dan cache otomatis di server
