name: CI/CD Deploy to Rumahweb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Laravel Project
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' # Diubah ke 20 karena tailwindcss/oxide membutuhkan Node >= 20
        
    - name: Install NPM & Build
      run: |
        rm -f package-lock.json
        npm install
        npm run build

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Diubah ke 8.3 karena composer.lock Anda membutuhkan paket untuk PHP >= 8.3
    
    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs
    
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        port: 21
        timeout: 120000
        server-dir: /public_html/company-profile/
        exclude: |
          **/.vscode/**
          **/.git/**
          # **/vendor/**  <-- Commented: Vendor sekarang ikut diupload karena sudah di-build di runner
          **/node_modules/**
          .env
          storage/framework/cache/**
          storage/framework/sessions/**
          storage/framework/views/**
          storage/logs/**
          public/sitemap.xml

    # Opsional: Karena menggunakan Shared Hosting tanpa SSH, kita bisa jalankan migrasi via URL (Webhook)
    - name: Run Artisan Migrate via Webhook
      run: |
        echo "Menjalankan migrasi dan cache di server..."
        curl -s https://scalifyintellegence.my.id/secret-deploy-trigger-12345