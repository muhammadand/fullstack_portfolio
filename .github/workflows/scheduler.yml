name: Daily Push Notifications

on:
  schedule:
    # 03:00 UTC sama dengan 10:00 WIB
    - cron: '0 3 * * *'
  workflow_dispatch: # Memungkinkan kita men-trigger secara manual dari tab Actions GitHub

jobs:
  run-reminders:
    name: Trigger Daily Push Notifications
    runs-on: ubuntu-latest
    steps:
    - name: Ping Webhook Broadcast
      run: |
        echo "Mengirim notifikasi push harian ke semua partner..."
        TARGET_URL="https://scalifyintellegence.my.id/api/cron/send-daily-push?secret=cuan-tiap-hari"
        
        echo "Mengakses: $TARGET_URL"
        RESPONSE=$(curl -f -L --max-time 180 -sS "$TARGET_URL")
        echo "Response dari server:"
        echo "$RESPONSE"


